# The Docker image. Every pull request that touches it builds it and checks that it starts, signs
# in over plain http and keeps its library in /data. Each release tag (v1.0.0 and so on) publishes it
# to ghcr.io/helenvholmes/bookbox for 64-bit Intel/AMD and ARM (a Raspberry Pi 4 or 5, most NAS boxes).
name: Docker

on:
  pull_request:
    paths: [Dockerfile, .dockerignore, docker-entrypoint.sh, docker-compose.yml, package-lock.json, next.config.ts, .github/workflows/docker.yml]
  push:
    tags: ["v*"]

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t bookbox:test .
      - name: Start it with a folder from the host, like docker-compose.yml does
        run: |
          mkdir bookbox-data
          docker run -d --name bookbox -p 3000:3000 -v "$PWD/bookbox-data:/data" \
            -e BOOKBOX_PASSWORD=test-password-for-ci -e BOOKBOX_SECRET=test-secret-for-ci bookbox:test
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' bookbox)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' bookbox | grep -qx healthy || { docker logs bookbox; exit 1; }
      - name: The library page needs signing in, and the database is in the mounted folder
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/library)
          echo "GET /library -> $code"
          [ "$code" = 307 ] || [ "$code" = 302 ] || [ "$code" = 303 ] || { docker logs bookbox; exit 1; }
          ls -la bookbox-data
          [ -n "$(ls bookbox-data)" ] || { echo "nothing written to /data"; docker logs bookbox; exit 1; }
      - if: always()
        run: docker logs bookbox

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 is tagged 1.2.3, 1.2, 1 and latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
