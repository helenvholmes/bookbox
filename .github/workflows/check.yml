# Lint, type-check and test every push to main and every pull request. Vercel builds and deploys on its
# own; this catches mistakes the build would let through (lint rules, accessibility lint included) and
# breaks in everyday actions like adding and saving books (the tests in e2e/).
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The route types (PageProps and friends) come from Next.js, not the repo.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Traces of failed tests, to step through with `npx playwright show-trace`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
